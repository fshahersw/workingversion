AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Seeger Weiss Legal Archive: the externalcorpus directory server and the
  Corpus Workbench sidecar, served read-only from a persistent EBS data volume
  on one ECS-managed EC2 instance, behind the Office engine ALB (path rule +
  origin key) with a loopback gateway that additionally requires the
  platform's app key. A scheduled refresher task pulls each GitHub data
  release onto the volume as an immutable release tree, verifies it, syncs the
  workbench and switches the served release atomically; daily EBS snapshots
  and the GitHub release itself are the recovery path.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [NamePrefix, Environment]
      - Label: { default: Network }
        Parameters: [VpcId, SubnetId, AvailabilityZone, AssociatePublicIp]
      - Label: { default: Shared ALB (office-engine stack outputs) }
        Parameters: [AlbListenerArn, AlbSecurityGroupId, AlbFullName, OriginAccessSecretArn]
      - Label: { default: Images and secrets }
        Parameters: [ArchiveImageUri, GatewayImageUri, AppKeySecretArn]
      - Label: { default: Instance and data }
        Parameters: [InstanceType, DataVolumeSizeGiB, SnapshotRetainCount]
      - Label: { default: Refresh }
        Parameters: [RefreshScheduleExpression, RefreshWorkbenchBudgetSeconds, RefreshFullVerify, RefreshLiveChecks, SkipOptionalUnits]
      - Label: { default: Operations }
        Parameters: [LogRetentionDays, AlarmTopicArn]

Parameters:
  NamePrefix:
    Type: String
    MinLength: 3
    MaxLength: 16
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
  Environment:
    Type: String
    AllowedValues: [testing, staging, prod]
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the single archive instance (needs egress to GitHub and ECR). The data volume is created in this subnet's Availability Zone.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Must be the Availability Zone of SubnetId (EBS volumes are zonal).
  AssociatePublicIp:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set true when the subnet has no NAT gateway (default VPC). Ingress is still limited to the ALB by the task security group.
  AlbListenerArn:
    Type: String
    AllowedPattern: "^arn:aws:elasticloadbalancing:.+:listener/app/.+$"
    Description: Listener of the Office engine ALB (office-engine stack output ListenerArn); the archive adds a path rule to it.
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group of the Office engine ALB (office-engine stack output AlbSecurityGroupId).
  AlbFullName:
    Type: String
    AllowedPattern: "^app/.+/.+$"
    Description: Full name of the Office engine ALB for CloudWatch dimensions (office-engine stack output LoadBalancerFullName).
  OriginAccessSecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:.+$"
    Description: The platform's CloudFront origin secret; its officeEngineOriginKey value is the X-Office-Origin-Key the archive path rule requires (resolved by CloudFormation, never handled by tooling).
  ArchiveImageUri:
    Type: String
    Description: Runtime image (legal-archive-build stack, ArchiveRepositoryUri:tag).
  GatewayImageUri:
    Type: String
    Description: Gateway image (legal-archive-build stack, GatewayRepositoryUri:tag).
  AppKeySecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:[^:]+:[0-9]{12}:secret:.+$"
    Description: >
      Full ARN of the dedicated Secrets Manager secret whose ARCHIVE_APP_KEY value
      the gateway requires in X-Archive-App-Key (created by the deploy script,
      never read by it).
  InstanceType:
    Type: String
    Default: m6i.large
    AllowedValues: [m6i.large, m6i.xlarge, m7i.large, m7i.xlarge, r6i.large]
  DataVolumeSizeGiB:
    Type: Number
    Default: 250
    MinValue: 150
    MaxValue: 1000
  SnapshotRetainCount:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30
  RefreshScheduleExpression:
    Type: String
    Default: "cron(0 3 * * ? *)"
    Description: EventBridge Scheduler cron for the nightly refresh (America/New_York).
  RefreshWorkbenchBudgetSeconds:
    Type: Number
    Default: 3600
    Description: Time budget per refresh for the Corpus Workbench sync (0 disables the sync).
  RefreshFullVerify:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: Re-hash every installed file after a pull (bootstrap.py verify). Slower, safer.
  RefreshLiveChecks:
    Type: String
    Default: advisory
    AllowedValues: [advisory, required]
    Description: Whether a failing verify_round2.py blocks the release switch. Advisory until the checks are known to pass against the units this deployment restores.
  SkipOptionalUnits:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: Set 1 to leave out the 43 GB of court-document originals (the index over them is still served).
  LogRetentionDays:
    Type: Number
    Default: 30
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic for the alarms.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]

Resources:
  # ── Cluster, logs, roles ────────────────────────────────────────────────────

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${NamePrefix}-${Environment}-legal-archive"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${NamePrefix}-${Environment}-legal-archive"
      RetentionInDays: !Ref LogRetentionDays

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: app-key-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppKeySecretArn

  # The serving task holds no AWS permissions: it reads the volume and answers HTTP.
  ArchiveTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # The refresher may force a new deployment of the archive service after a switch and publish metrics.
  RefresherTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: refresh
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Redeploy
                Effect: Allow
                Action: ecs:UpdateService
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/${NamePrefix}-${Environment}-legal-archive"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: { "cloudwatch:namespace": LegalArchive }

  # ── The instance and its data volume ──────────────────────────────────────

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: attach-data-volume
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeVolumes
                Resource: "*"
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/${DataVolume}"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Legal archive instance (no ingress; tasks use their own ENI security group)
      VpcId: !Ref VpcId

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Legal archive task ENIs (gateway 8781 from the shared ALB only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8781
          ToPort: 8781
          SourceSecurityGroupId: !Ref AlbSecurityGroupId

  # Persistent, encrypted, retained on stack deletion: the releases live here.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: !Ref DataVolumeSizeGiB
      VolumeType: gp3
      Iops: 6000
      Throughput: 250
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-${Environment}-legal-archive-data"
        - Key: legal-archive-snapshot
          Value: daily

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${NamePrefix}-${Environment}-legal-archive"
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id}}"
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: !Ref AssociatePublicIp
            Groups: [!Ref InstanceSecurityGroup]
            DeleteOnTermination: true
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 60, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${NamePrefix}-${Environment}-legal-archive"
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            # ECS agent: join the cluster; task IAM roles must also work for host-network tasks (the refresher).
            cat >> /etc/ecs/ecs.config <<EOF
            ECS_CLUSTER=${Cluster}
            ECS_ENABLE_TASK_IAM_ROLE=true
            ECS_ENABLE_TASK_IAM_ROLE_NETWORK_HOST=true
            ECS_AVAILABLE_LOGGING_DRIVERS=["json-file","awslogs"]
            ECS_RESERVED_MEMORY=512
            ECS_IMAGE_PULL_BEHAVIOR=prefer-cached
            EOF
            # Attach the persistent data volume (same AZ), retrying while a previous instance releases it.
            TOKEN=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            VOLUME_ID="${DataVolume}"
            for attempt in $(seq 1 40); do
              STATE=$(aws ec2 describe-volumes --region ${AWS::Region} --volume-ids "$VOLUME_ID" --query "Volumes[0].State" --output text)
              if [ "$STATE" = "available" ]; then
                aws ec2 attach-volume --region ${AWS::Region} --volume-id "$VOLUME_ID" --instance-id "$INSTANCE_ID" --device /dev/sdf && break
              fi
              ATTACHED_TO=$(aws ec2 describe-volumes --region ${AWS::Region} --volume-ids "$VOLUME_ID" --query "Volumes[0].Attachments[0].InstanceId" --output text)
              [ "$ATTACHED_TO" = "$INSTANCE_ID" ] && break
              sleep 15
            done
            # Nitro exposes EBS as NVMe; find the device by volume serial.
            SERIAL=$(echo "$VOLUME_ID" | tr -d '-')
            DEV=""
            for attempt in $(seq 1 60); do
              DEV=$(lsblk -dno NAME,SERIAL | awk -v s="$SERIAL" '$2==s {print "/dev/"$1}')
              [ -n "$DEV" ] && break
              sleep 2
            done
            [ -n "$DEV" ] || { echo "data volume device not found"; exit 1; }
            # XFS with reflinks: the refresher clones the served release copy-on-write before pulling changes into it.
            if ! blkid "$DEV" >/dev/null 2>&1; then
              mkfs.xfs -m reflink=1 -L archivedata "$DEV"
            fi
            mkdir -p /data
            UUID=$(blkid -s UUID -o value "$DEV")
            grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /data xfs defaults,nofail,noatime 0 2" >> /etc/fstab
            mountpoint -q /data || mount /data
            chmod 755 /data
            # The ECS agent starts after user data; make sure it picks up the cluster config.
            systemctl restart ecs || true

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${NamePrefix}-${Environment}-legal-archive"
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref SubnetId]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-${Environment}-legal-archive"
          PropagateAtLaunch: true
        - Key: AmazonECSManaged
          Value: "true"
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT10M
        WaitOnResourceSignals: false

  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-legal-archive"
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling: { Status: DISABLED }
        ManagedTerminationProtection: DISABLED

  ClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1

  # ── Task definitions ────────────────────────────────────────────────────

  ArchiveTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${NamePrefix}-${Environment}-legal-archive"
      NetworkMode: awsvpc
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ArchiveTaskRole.Arn
      Volumes:
        - Name: data
          Host: { SourcePath: /data }
      ContainerDefinitions:
        - Name: gateway
          Image: !Ref GatewayImageUri
          Essential: true
          MemoryReservation: 128
          Memory: 256
          PortMappings: [{ ContainerPort: 8781, Protocol: tcp }]
          Secrets:
            - Name: ARCHIVE_APP_KEY
              ValueFrom: !Sub "${AppKeySecretArn}:ARCHIVE_APP_KEY::"
          DependsOn:
            - { ContainerName: archive, Condition: START }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway
          HealthCheck:
            Command: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8781/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
        - Name: archive
          Image: !Ref ArchiveImageUri
          Command: [archive]
          Essential: true
          MemoryReservation: 2048
          Memory: 4096
          Environment:
            - { Name: ARCHIVE_DATA, Value: /data }
            - { Name: ARCHIVE_PORT, Value: "8769" }
          MountPoints:
            - { SourceVolume: data, ContainerPath: /data, ReadOnly: false }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: archive
        - Name: workbench
          Image: !Ref ArchiveImageUri
          Command: [workbench]
          Essential: false
          MemoryReservation: 768
          Memory: 2048
          Environment:
            - { Name: ARCHIVE_DATA, Value: /data }
            - { Name: ARCHIVE_PORT, Value: "8769" }
            - { Name: WORKBENCH_PORT, Value: "8770" }
          MountPoints:
            - { SourceVolume: data, ContainerPath: /data, ReadOnly: false }
          DependsOn:
            - { ContainerName: archive, Condition: START }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: workbench

  # Host network: no task ENI needed (the instance type allows few), and the
  # staging server it starts on 127.0.0.1:8769 cannot collide with the service
  # task, which lives in its own awsvpc namespace.
  RefresherTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${NamePrefix}-${Environment}-legal-archive-refresh"
      NetworkMode: host
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt RefresherTaskRole.Arn
      Volumes:
        - Name: data
          Host: { SourcePath: /data }
      ContainerDefinitions:
        - Name: refresh
          Image: !Ref ArchiveImageUri
          Command: [refresh, run]
          Essential: true
          MemoryReservation: 1024
          Memory: 3072
          Environment:
            - { Name: ARCHIVE_DATA, Value: /data }
            - { Name: ARCHIVE_SKIP_OPTIONAL, Value: !Ref SkipOptionalUnits }
            - { Name: REFRESH_FULL_VERIFY, Value: !Ref RefreshFullVerify }
            - { Name: REFRESH_LIVE_CHECKS, Value: !Ref RefreshLiveChecks }
            - { Name: REFRESH_WB_BUDGET_SECONDS, Value: !Ref RefreshWorkbenchBudgetSeconds }
            - { Name: REFRESH_KEEP_RELEASES, Value: "1" }
            - { Name: ECS_CLUSTER, Value: !Ref Cluster }
            - { Name: ECS_SERVICE, Value: !Sub "${NamePrefix}-${Environment}-legal-archive" }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
            - { Name: CLOUDWATCH_NAMESPACE, Value: LegalArchive }
          MountPoints:
            - { SourceVolume: data, ContainerPath: /data, ReadOnly: false }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: refresh

  # ── ALB path on the shared Office engine listener ──────────────────────────

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8781
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  # Priority 5 beats the engine's path-agnostic origin-key rule (priority 10).
  ArchivePathRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: 5
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/archive-api/*", "/workbench-api/*"]
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Office-Origin-Key
            # Resolved by CloudFormation from the platform's origin secret; tooling never handles the value.
            Values: [!Sub "{{resolve:secretsmanager:${OriginAccessSecretArn}:SecretString:officeEngineOriginKey}}"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: [ArchivePathRule, ClusterCapacityProviders]
    Properties:
      ServiceName: !Sub "${NamePrefix}-${Environment}-legal-archive"
      Cluster: !Ref Cluster
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
      DesiredCount: 1
      TaskDefinition: !Ref ArchiveTaskDefinition
      HealthCheckGracePeriodSeconds: 120
      # One instance: stop the old task, start the new one (about a minute at 03:00).
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref SubnetId]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: gateway
          ContainerPort: 8781
          TargetGroupArn: !Ref TargetGroup

  # ── Nightly refresh ──────────────────────────────────────────────────────

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-refresher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${NamePrefix}-${Environment}-legal-archive-refresh:*"
                Condition:
                  ArnEquals: { "ecs:cluster": !GetAtt Cluster.Arn }
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt RefresherTaskRole.Arn

  RefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-legal-archive-refresh"
      Description: Nightly pull of the externalcorpus data release onto the archive volume.
      ScheduleExpression: !Ref RefreshScheduleExpression
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref RefresherTaskDefinition
          LaunchType: EC2
          TaskCount: 1
          PropagateTags: TASK_DEFINITION
        RetryPolicy: { MaximumRetryAttempts: 0 }

  # ── Snapshots ───────────────────────────────────────────────────────────

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: !Sub "Daily snapshots of the ${NamePrefix}-${Environment} legal archive data volume"
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [VOLUME]
        TargetTags:
          - Key: legal-archive-snapshot
            Value: daily
        Schedules:
          - Name: daily
            # 10:00 UTC = 06:00 ET, after the 03:00 ET refresh window.
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["10:00"] }
            RetainRule: { Count: !Ref SnapshotRetainCount }
            CopyTags: true

  # ── Alarms ──────────────────────────────────────────────────────────────

  AlarmUnhealthy:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Legal archive gateway unhealthy behind the shared ALB
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !Ref AlbFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]

  AlarmRefreshFailed:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A legal archive refresh failed (the served release is unchanged)
      Namespace: LegalArchive
      MetricName: RefreshFailed
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  RefresherTaskDefinitionArn:
    Description: Run this task (EC2 launch type, host network) for the first pull or an ad-hoc refresh.
    Value: !Ref RefresherTaskDefinition
  DataVolumeId:
    Value: !Ref DataVolume
  TargetGroupArn:
    Value: !Ref TargetGroup
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
