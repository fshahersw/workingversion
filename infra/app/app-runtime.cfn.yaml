AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lit AI full-stack runtime for one new environment. Runs the TanStack
  Start/Nitro build on Lambda through Lambda Web Adapter, streams through a
  Regional API Gateway REST API, and places CloudFront plus WAF in front. This
  template consumes app-foundation and KB outputs and never adopts existing
  development resources.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    why: Own stateless application compute, streaming ingress, edge delivery, and runtime observability.
    must:
      - Use REST API InvokeWithResponseStream, preserve cookies and SSE, and never reference development resources.
  DeploymentBoundary:
    ExistingResources: >
      This stack accepts producer-stack outputs as parameters. It does not
      import, discover, or adopt resources by physical name.
    ApiGatewayAccountLogging: >
      REST API access logging requires the regional API Gateway account
      CloudWatch role to be configured outside this environment stack. This
      template intentionally does not own the region-wide AWS::ApiGateway::Account.
    OriginProtection: >
      CloudFront supplies a generated foundation secret as an x-api-key origin
      header. Both REST methods require that key, preventing direct origin
      requests from bypassing CloudFront and its WAF.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming and deployment safety
        Parameters:
          - NamePrefix
          - Environment
          - DeploymentIntent
          - ApiGatewayAccountLoggingMode
      - Label:
          default: Versioned runtime artifact
        Parameters:
          - ArtifactBucketName
          - ArtifactObjectKey
          - ArtifactObjectVersion
          - Architecture
          - LambdaMemorySize
          - LambdaTimeoutSeconds
          - LambdaReservedConcurrency
      - Label:
          default: App foundation outputs
        Parameters:
          - AppKmsKeyArn
          - AppAccessPolicyArn
          - DynamoTableName
          - AppDataBucketName
          - OriginAccessSecretArn
          - CognitoRegion
          - CognitoUserPoolId
          - CognitoClientId
          - CognitoDomain
          - CognitoRedirectUri
          - CognitoLogoutUri
      - Label:
          default: KB stack outputs
        Parameters:
          - KbAccessPolicyArn
          - KbClusterArn
          - KbSecretArn
          - KbDatabase
          - KbIngestAccessPolicyArn
          - KbIngestJobsTableName
          - KbIngestQueueUrl
          - MattersCorpusBucketName
          - MattersSyncSchedule
          - IntelRefreshSchedule
          - RuntimeSecretRevision
      - Label:
          default: AI and application configuration
        Parameters:
          - BedrockRegion
          - BdaProjectArn
          - BdaProfileArn
          - AgentCoreGatewayUrl
          - AgentCoreSearchTool
          - AgentCoreCodeInterpreterId
          - CorpusUrl
          - CorpusPublishableKey
          - CorpusServiceSecretArn
          - OfficeModel
          - OfficeFastModel
          - OfficeInspectModel
          - OfficeThoroughModel
          - OfficeTiering
      - Label:
          default: API, edge, and WAF controls
        Parameters:
          - ApiStageName
          - ApiDeploymentSlot
          - ApiIntegrationTimeoutMilliseconds
          - ApiThrottleRateLimit
          - ApiThrottleBurstLimit
          - CloudFrontPriceClass
          - CloudFrontOriginReadTimeout
          - AppAliasDomain
          - AcmCertificateArn
          - WafRateLimit
      - Label:
          default: Alarms
        Parameters:
          - AlarmTopicArn
          - LambdaDurationAlarmMilliseconds
          - ApiLatencyAlarmMilliseconds
    ParameterLabels:
      DeploymentIntent:
        default: Confirm this is a new environment
      OriginAccessSecretArn:
        default: Foundation CloudFront origin-access secret ARN
      KbAccessPolicyArn:
        default: KB producer managed-policy ARN

Rules:
  CloudFrontWebAclRegion:
    Assertions:
      - Assert: !Equals
          - !Ref AWS::Region
          - us-east-1
        AssertDescription: >
          Deploy this CloudFront-scoped WAF stack in us-east-1. No AWS call is
          needed to validate this rule locally.

Parameters:
  NamePrefix:
    Type: String
    MinLength: 3
    MaxLength: 16
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
    ConstraintDescription: >
      Use 3-16 lowercase letters, numbers, or hyphens; start with a letter and
      end with a letter or number.
    Description: Stable lowercase application prefix used in physical names.

  Environment:
    Type: String
    AllowedValues:
      - testing
      - staging
      - prod
    Description: Runtime environment label. testing adopts existing data-plane IDs via parameters; it does not create a second database.

  DeploymentIntent:
    Type: String
    AllowedValues:
      - new-environment
    Description: >
      Required acknowledgement that this template creates a new runtime and is
      not an import or adoption mechanism.

  ApiGatewayAccountLoggingMode:
    Type: String
    AllowedValues:
      - preconfigured-outside-this-stack
    Description: >
      Acknowledges that the region-wide API Gateway CloudWatch role is managed
      separately and already permits REST API access-log delivery.

  ArtifactBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: Supply the app-foundation deployment artifact bucket name.
    Description: DeploymentArtifactBucketName output from app-foundation.

  ArtifactObjectKey:
    Type: String
    MinLength: 1
    MaxLength: 1024
    AllowedPattern: "^[^\\r\\n]+\\.zip$"
    ConstraintDescription: Supply a nonempty S3 object key ending in .zip.
    Description: Key of the locally built Lambda runtime ZIP.

  ArtifactObjectVersion:
    Type: String
    MinLength: 1
    MaxLength: 1024
    AllowedPattern: "^[^\\r\\n]+$"
    ConstraintDescription: Supply the immutable S3 VersionId returned by an authorized upload.
    Description: Exact version ID of ArtifactObjectKey in the versioned foundation bucket.

  Architecture:
    Type: String
    Default: arm64
    AllowedValues:
      - arm64
      - x86_64
    Description: Lambda instruction-set architecture; must match the adapter layer.

  LambdaMemorySize:
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 10240
    Description: Lambda memory in MiB.

  LambdaTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 30
    MaxValue: 900
    Description: Lambda invocation timeout. API Gateway streams for at most 15 minutes.

  LambdaReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
    Description: Reserved concurrency protecting downstream services and account capacity.

  AppKmsKeyArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:kms:[^:]+:[0-9]{12}:key/[A-Fa-f0-9-]+$"
    ConstraintDescription: Supply the KmsKeyArn output from app-foundation.
    Description: App-foundation KMS key used for Lambda environment and log encryption.

  AppAccessPolicyArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:iam::[0-9]{12}:policy/.+$"
    ConstraintDescription: Supply the ApplicationAccessPolicyArn output from app-foundation.
    Description: App-foundation managed policy for app data and approved AI resources.

  DynamoTableName:
    Type: String
    MinLength: 3
    MaxLength: 255
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
    Description: DynamoTableName output from app-foundation; exported as SW_DDB_TABLE.

  AppDataBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    Description: S3BucketName output from app-foundation; exported as SW_S3_BUCKET.

  OriginAccessSecretArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$"
    ConstraintDescription: Supply the CloudFrontOriginAccessSecretArn foundation output.
    Description: >
      ARN of the foundation-generated secret whose originKey field is resolved
      by CloudFormation. The secret value is never a template parameter.

  CognitoRegion:
    Type: String
    AllowedPattern: "^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$"
    Description: CognitoRegion output from app-foundation.

  CognitoUserPoolId:
    Type: String
    MinLength: 1
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: CognitoUserPoolId output from app-foundation.

  CognitoClientId:
    Type: String
    MinLength: 1
    AllowedPattern: "^[A-Za-z0-9]+$"
    Description: CognitoClientId output from app-foundation.

  CognitoDomain:
    Type: String
    MinLength: 1
    AllowedPattern: "^[A-Za-z0-9.-]+$"
    Description: CognitoDomain output from app-foundation without an https scheme.

  CognitoRedirectUri:
    Type: String
    AllowedPattern: "^https://[^\\s]+/auth/callback$"
    ConstraintDescription: Supply the reviewed HTTPS CloudFront callback URL.
    Description: CognitoCallbackUrl output from app-foundation.

  CognitoLogoutUri:
    Type: String
    AllowedPattern: "^https://[^\\s]+/$"
    ConstraintDescription: Supply the reviewed HTTPS CloudFront post-logout URL.
    Description: CognitoLogoutUrl output from app-foundation.

  KbAccessPolicyArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:iam::[0-9]{12}:policy/.+$"
    ConstraintDescription: Supply the AppAccessPolicyArn output from the KB stack.
    Description: >
      KB producer managed policy attached to the runtime role. KB permissions
      are not duplicated by this template or app-foundation.

  KbClusterArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:rds:[^:]+:[0-9]{12}:cluster:.+$"
    ConstraintDescription: Supply the ClusterArn output from the KB stack.
    Description: KB_CLUSTER_ARN from the separately deployed KB stack.

  KbSecretArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$"
    ConstraintDescription: Supply the KbAppSecretArn output from the KB stack.
    Description: >
      KB_SECRET_ARN for Data API calls. The runtime receives only the ARN; the
      KB producer policy grants GetSecretValue on that exact secret.

  KbDatabase:
    Type: String
    Default: kb
    MinLength: 1
    MaxLength: 63
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]*$"
    Description: Database output from the KB stack.

  KbIngestAccessPolicyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:iam::[0-9]{12}:policy/.+$"
    ConstraintDescription: Supply the AppIngestAccessPolicyArn output from the KB ingest stack, or leave empty.
    Description: Producer-owned policy for exact ingest-job registration. Empty when async ingest is not deployed.

  KbIngestJobsTableName:
    Type: String
    Default: ""
    MaxLength: 255
    AllowedPattern: "^$|^[A-Za-z0-9_.-]+$"
    Description: IngestJobsTableName output; exported as KB_INGEST_JOBS_TABLE. Empty when unused.

  KbIngestQueueUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[^\\s]+$"
    ConstraintDescription: Supply the HTTPS IngestQueueUrl output from the KB ingest stack, or leave empty.
    Description: IngestQueueUrl output; exported as KB_INGEST_QUEUE_URL. Empty when unused.

  MattersCorpusBucketName:
    Type: String
    Default: ""
    MaxLength: 63
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    Description: >-
      S3 bucket holding the firm's docket PDFs (matters corpus, SSE-S3). The
      runtime presigns inline GETs for the /matters PDF pane and admin PUTs into
      <slug>/incoming/. Exported as MATTERS_CORPUS_BUCKET. Empty disables the
      grant and the app falls back to its compiled default bucket name.

  RuntimeSecretRevision:
    Type: String
    Default: "1"
    MaxLength: 32
    AllowedPattern: "^[A-Za-z0-9._-]+$"
    Description: >-
      Opaque marker exported as RUNTIME_SECRET_REVISION. CloudFormation only
      re-reads a Secrets Manager dynamic reference when the containing property
      changes, so after rotating a key inside CorpusServiceSecretArn, bump this
      value (deploy-testing.mjs --refresh-env does it) to make the function pick
      up the new secret values.

  MattersSyncSchedule:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(rate\\([0-9]+ (minute|minutes|hour|hours|day|days)\\)|cron\\(.+\\))$"
    ConstraintDescription: An EventBridge schedule expression such as rate(30 minutes), or empty.
    Description: >-
      When set (and MattersCorpusBucketName is set), a small invoker Lambda calls
      POST /api/public/matters/sync on this schedule to pull new docket entries and
      PDFs for the followed hub dockets from DocketBird. The route authenticates with
      INGEST_API_KEY, which must exist as a key in the CorpusServiceSecretArn secret.
      Empty disables the schedule, the invoker and the INGEST_API_KEY export.

  IntelRefreshSchedule:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(rate\\([0-9]+ (minute|minutes|hour|hours|day|days)\\)|cron\\(.+\\))$"
    ConstraintDescription: An EventBridge schedule expression such as rate(4 hours), or empty.
    Description: >-
      When set, a small invoker Lambda calls POST /api/public/intel/run on this
      schedule to refresh the litigation-intelligence feed (Tavily discovery +
      Firecrawl enrichment + Bedrock briefings + the QA gate). The route
      authenticates with INGEST_API_KEY from the CorpusServiceSecretArn secret.
      The invoker passes a deadline + scrape cap so the run stays inside the
      API-gateway timeout. Empty disables the schedule and its invoker.

  BedrockRegion:
    Type: String
    Default: us-east-1
    AllowedPattern: "^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$"
    Description: Region used by Bedrock, BDA, and AgentCore clients.

  BdaProjectArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:bedrock:[^:]+:[0-9]{12}:data-automation-project/[A-Za-z0-9_-]+$"
    ConstraintDescription: Supply the same exact BDA project ARN granted by app-foundation.
    Description: BDA_PROJECT_ARN runtime setting.

  BdaProfileArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:bedrock:[^:]+:[^:]*:data-automation-profile/[A-Za-z0-9._/-]+$"
    ConstraintDescription: Supply the same exact BDA profile ARN granted by app-foundation.
    Description: BDA_PROFILE_ARN runtime setting.

  AgentCoreGatewayUrl:
    Type: String
    AllowedPattern: "^https://[A-Za-z0-9.-]+\\.gateway\\.bedrock-agentcore\\.[A-Za-z0-9-]+\\.amazonaws\\.com(/[^\\s]*)?$"
    ConstraintDescription: Supply the HTTPS AgentCore gateway MCP URL.
    Description: AGENTCORE_SEARCH_URL paired with the exact gateway ARN granted by app-foundation.

  AgentCoreSearchTool:
    Type: String
    Default: general___WebSearch
    MinLength: 1
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: AGENTCORE_SEARCH_TOOL exposed by the approved gateway.

  AgentCoreCodeInterpreterId:
    Type: String
    Default: aws.codeinterpreter.v1
    MinLength: 1
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9._-]+$"
    Description: CODE_INTERPRETER_ID paired with the exact resource ARN granted by app-foundation.

  CorpusUrl:
    Type: String
    AllowedPattern: "^https://[^\\s/]+(?:/[^\\s]*)?$"
    ConstraintDescription: Supply the HTTPS public corpus service URL.
    Description: Public corpus URL retained for application compatibility.

  CorpusPublishableKey:
    Type: String
    NoEcho: true
    MinLength: 1
    MaxLength: 2048
    AllowedPattern: "^[^\\r\\n]+$"
    ConstraintDescription: Supply the public publishable corpus key, not a service-role secret.
    Description: >
      Public browser-safe corpus key retained for compatibility. Real service
      credentials use a separate Secrets Manager dynamic reference.

  CorpusServiceSecretArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$"
    ConstraintDescription: Supply an existing Secrets Manager secret ARN.
    Description: >
      Existing secret containing the runtime's third-party credentials as JSON
      keys: CORPUS_SERVICE_KEY, BRAVE_API_KEY, TAVILY_API_KEY, FIRECRAWL_API_KEY,
      COURTLISTENER_API_TOKEN, DOCKETBIRD_API_KEY (each key must exist; an empty
      value disables that integration. NCBI_API_KEY and OPENFDA_API_KEY may be
      present and empty). CloudFormation resolves each key without accepting
      credentials as plaintext parameters.

  OfficeModel:
    Type: String
    Default: us.anthropic.claude-sonnet-5
    MinLength: 1
    MaxLength: 128
    Description: >
      Office assistant main tier (drafting, analysis, thorough runs). Bedrock
      model or inference-profile id; must be in the foundation policy's
      Bedrock allow-list.

  OfficeFastModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    MinLength: 1
    MaxLength: 128
    Description: >
      Office assistant fast tier (short edits, routing, vision inspection).
      Must accept image content blocks.

  OfficeInspectModel:
    Type: String
    Default: ""
    MaxLength: 128
    Description: >
      Optional text-only inspect/format tier. Empty (default) routes inspect and
      format rounds to the fast tier (Haiku), the reliable default.

  OfficeThoroughModel:
    Type: String
    Default: ""
    MaxLength: 128
    Description: >
      Optional premium tier used only by the Thorough profile (e.g.
      us.anthropic.claude-opus-4-8). Empty keeps Thorough on the main tier.
      Must be in the foundation policy's Bedrock allow-list.

  OfficeTiering:
    Type: String
    Default: "on"
    AllowedValues:
      - "on"
      - "off"
    Description: off sends every Office assistant turn to the main tier.

  WorkflowsEnabled:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - "true"
      - "false"
    Description: >
      "true" enables the Workflows subsystem (/workflows + /api/workflows). Empty
      or "false" keeps it dark (server gates fail closed). Durable/scheduled runs
      also require WorkflowsQueueUrl.

  WorkflowsQueueUrl:
    Type: String
    Default: ""
    Description: >
      SQS queue URL for durable workflow execution — the QueueUrl output of the
      workflows stack. Empty disables queued/scheduled runs (startRun returns 503).

  WorkflowsSchedulerEnabled:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - "true"
      - "false"
    Description: '"true" advertises scheduled-run capability; the scheduler Lambda in the workflows stack drives the actual cron.'

  WorkflowsPythonInterpreterId:
    Type: String
    Default: ""
    MaxLength: 128
    Description: >
      Bedrock AgentCore code-interpreter id for isolated workflow Python steps
      (e.g. aws.codeinterpreter.v1). Empty makes Python steps return 503.

  WorkflowsDailyRunLimit:
    Type: String
    Default: ""
    Description: Optional per-user daily workflow-run cap; empty uses the code default.

  BedrockResearchModel:
    Type: String
    Default: us.anthropic.claude-sonnet-5
    MinLength: 1
    MaxLength: 128
    Description: >
      Bedrock model / inference-profile for research and workflow AI steps; must be
      in the foundation Bedrock allow-list.

  ApiStageName:
    Type: String
    Default: app
    MinLength: 1
    MaxLength: 32
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: REST API stage name used by the CloudFront origin path.

  ApiDeploymentSlot:
    Type: String
    Default: blue
    AllowedValues:
      - blue
      - green
    Description: >
      Deployment snapshot slot. Toggle this value whenever REST resources,
      methods, integrations, or response-streaming settings change.

  ApiIntegrationTimeoutMilliseconds:
    Type: Number
    Default: 300000
    MinValue: 50
    MaxValue: 900000
    Description: >
      REST integration timeout. Values above the account default require a
      separately reviewed API Gateway quota before deployment.

  ApiThrottleRateLimit:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 10000
    Description: Per-stage and per-origin-key steady-state requests per second.

  ApiThrottleBurstLimit:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 10000
    Description: Per-stage and per-origin-key burst request limit.

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront geographic price class.

  CloudFrontOriginReadTimeout:
    Type: Number
    Default: 120
    MinValue: 30
    MaxValue: 120
    Description: >
      Seconds CloudFront waits between origin response packets. SSE producers
      must emit heartbeats more frequently than this value.

  AppAliasDomain:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
    ConstraintDescription: Supply a hostname such as testing.seegerweiss.com, or leave empty.
    Description: >
      Optional custom domain for CloudFront. Empty keeps the default
      *.cloudfront.net hostname. DNS is owned outside this stack.

  AcmCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:acm:us-east-1:[0-9]{12}:certificate/[A-Fa-f0-9-]+$"
    ConstraintDescription: Supply a us-east-1 ACM certificate ARN, or leave empty.
    Description: >
      Required with AppAliasDomain. Must be an issued ACM certificate in
      us-east-1. Leave empty until IT provides the ARN.

  WafRateLimit:
    Type: Number
    Default: 2000
    MinValue: 100
    MaxValue: 2000000000
    Description: Five-minute per-IP request limit enforced at CloudFront.

  OfficeEngineOriginDomain:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9.-]+$"
    Description: >
      Optional ALB DNS name of the Office engine service (office-engine.cfn.yaml
      LoadBalancerDnsName). When set, CloudFront routes /engine/* to it with
      the X-Office-Origin-Key header and the Lambda receives the OFFICE_ENGINE_*
      settings that turn on Sheets and Slides.

  OfficeEngineOriginProtocol:
    Type: String
    Default: https-only
    AllowedValues: [https-only, http-only]
    Description: >
      Protocol CloudFront uses to the engine ALB. http-only only while the ALB
      has no certificate; the listener is then reachable solely from CloudFront's
      origin-facing ranges and requires the origin key.

  OfficeEnginePublicUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[^/]+$"
    Description: >
      The platform origin browsers use (the CloudFront URL or alias). Browsers
      reach the engine through this origin's /engine/* behavior, and the engine
      verifies tokens whose issuer is this URL. Required with OfficeEngineOriginDomain.

  OfficeEngineJwtSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$"
    Description: >
      Secrets Manager secret holding {"privateKeyPem": PKCS#8 RSA key, "kid": key id}
      the platform signs engine tokens with. Read at runtime (never placed in
      the environment: Lambda variables are capped at 4 KB). Required with
      OfficeEngineOriginDomain.

  AlarmTopicArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:sns:[^:]+:[0-9]{12}:[A-Za-z0-9_-]+$"
    ConstraintDescription: Supply an SNS topic ARN or leave empty.
    Description: Optional existing SNS topic for alarm and recovery actions.

  LambdaDurationAlarmMilliseconds:
    Type: Number
    Default: 750000
    MinValue: 1000
    MaxValue: 900000
    Description: Lambda p95 duration threshold.

  ApiLatencyAlarmMilliseconds:
    Type: Number
    Default: 240000
    MinValue: 100
    MaxValue: 900000
    Description: API Gateway p95 latency threshold.

Mappings:
  LambdaAdapterLayers:
    arm64:
      Arn: "arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerArm64:28"
    x86:
      Arn: "arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerX86:28"
  EnvironmentSettings:
    testing:
      LogRetentionDays: 30
    staging:
      LogRetentionDays: 30
    prod:
      LogRetentionDays: 365

Conditions:
  HasAlarmTopic: !Not
    - !Equals
      - !Ref AlarmTopicArn
      - ""
  HasOfficeEngine: !And
    - !Not
      - !Equals
        - !Ref OfficeEngineOriginDomain
        - ""
    - !Not
      - !Equals
        - !Ref OfficeEnginePublicUrl
        - ""
    - !Not
      - !Equals
        - !Ref OfficeEngineJwtSecretArn
        - ""
  HasCustomDomain: !And
    - !Not
      - !Equals
        - !Ref AppAliasDomain
        - ""
    - !Not
      - !Equals
        - !Ref AcmCertificateArn
        - ""
  HasMattersCorpus: !Not
    - !Equals
      - !Ref MattersCorpusBucketName
      - ""
  HasMattersSync: !And
    - !Condition HasMattersCorpus
    - !Not
      - !Equals
        - !Ref MattersSyncSchedule
        - ""
  HasIntelRefresh: !Not
    - !Equals
      - !Ref IntelRefreshSchedule
      - ""
  # INGEST_API_KEY is exported to the app Lambda when ANY /api/public ingest
  # consumer is enabled (the matters sync or the intel refresh).
  HasIngestConsumer: !Or
    - !Condition HasMattersSync
    - !Condition HasIntelRefresh
  HasKbIngest: !And
    - !Not
      - !Equals
        - !Ref KbIngestAccessPolicyArn
        - ""
    - !Not
      - !Equals
        - !Ref KbIngestJobsTableName
        - ""
    - !Not
      - !Equals
        - !Ref KbIngestQueueUrl
        - ""
  HasOfficeInspectModel: !Not
    - !Equals
      - !Ref OfficeInspectModel
      - ""
  HasOfficeThoroughModel: !Not
    - !Equals
      - !Ref OfficeThoroughModel
      - ""
  UseBlueDeployment: !Equals
    - !Ref ApiDeploymentSlot
    - blue
  UseGreenDeployment: !Equals
    - !Ref ApiDeploymentSlot
    - green
  UseArm64: !Equals
    - !Ref Architecture
    - arm64

Resources:
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Store structured Lambda system and application logs under the foundation KMS policy.
        must:
          - Retain on replacement or deletion and never log document bodies through infrastructure settings.
        mutable: change-with-constraints
    Properties:
      LogGroupName: !Sub "/lit-ai/${NamePrefix}/${Environment}/app-runtime"
      KmsKeyId: !Ref AppKmsKeyArn
      RetentionInDays: !FindInMap
        - EnvironmentSettings
        - !Ref Environment
        - LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DeploymentIntent
          Value: !Ref DeploymentIntent
        - Key: ManagedBy
          Value: CloudFormation

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Store minimal request metadata for the Regional REST API.
        must:
          - Exclude request bodies, query strings, cookies, authorization headers, and document text.
        mutable: change-with-constraints
    Properties:
      LogGroupName: !Sub "/lit-ai/${NamePrefix}/${Environment}/app-api-access"
      KmsKeyId: !Ref AppKmsKeyArn
      RetentionInDays: !FindInMap
        - EnvironmentSettings
        - !Ref Environment
        - LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DeploymentIntent
          Value: !Ref DeploymentIntent
        - Key: ManagedBy
          Value: CloudFormation

  RuntimeRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Combine producer-owned app and KB policies with runtime-only telemetry permissions.
        must:
          - Use the Lambda service trust and never duplicate KB data permissions inline.
        mutable: review-required
    Properties:
      RoleName: !Sub "${NamePrefix}-${Environment}-app-runtime"
      Path: !Sub "/lit-ai/${Environment}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaServiceTrust
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref AppAccessPolicyArn
        - !Ref KbAccessPolicyArn
        - !If
          - HasKbIngest
          - !Ref KbIngestAccessPolicyArn
          - !Ref AWS::NoValue
      Policies:
        - !If
          - HasMattersCorpus
          - PolicyName: matters-corpus
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: MattersCorpusRead
                  Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${MattersCorpusBucketName}/*"
                - Sid: MattersCorpusWrite
                  Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${MattersCorpusBucketName}/*"
          - !Ref AWS::NoValue
        - PolicyName: runtime-telemetry
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LambdaLogWrites
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/lit-ai/${NamePrefix}/${Environment}/app-runtime:*"
              - Sid: XRayTelemetry
                Effect: Allow
                Action:
                  - xray:PutTelemetryRecords
                  - xray:PutTraceSegments
                Resource: "*"
              - !If
                - HasOfficeEngine
                - Sid: OfficeEngineSigningKey
                  Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource: !Ref OfficeEngineJwtSecretArn
                - !Ref AWS::NoValue
        - PolicyName: office-image-edit
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OfficeImageEditModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-image-remove-background-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-image-search-replace-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-image-search-recolor-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-image-erase-object-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-image-inpaint-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-outpaint-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-image-style-guide-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-style-transfer-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-image-control-sketch-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-image-control-structure-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-fast-upscale-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-conservative-upscale-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/stability.stable-creative-upscale-v1:0"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DeploymentIntent
          Value: !Ref DeploymentIntent
        - Key: ManagedBy
          Value: CloudFormation

  AppFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Run the Nitro server through Lambda Web Adapter on a managed Node runtime.
        must:
          - Use a versioned artifact, architecture-matched adapter layer, response_stream mode, and no static AWS keys.
        mutable: change-with-constraints
    Properties:
      FunctionName: !Sub "${NamePrefix}-${Environment}-app"
      Description: !Sub "Lit AI ${Environment} full-stack Nitro runtime"
      PackageType: Zip
      Runtime: nodejs22.x
      Handler: run.sh
      Architectures:
        - !Ref Architecture
      Layers:
        - !If
          - UseArm64
          - !FindInMap [LambdaAdapterLayers, arm64, Arn]
          - !FindInMap [LambdaAdapterLayers, x86, Arn]
      Role: !GetAtt RuntimeRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ArtifactObjectKey
        S3ObjectVersion: !Ref ArtifactObjectVersion
      KmsKeyArn: !Ref AppKmsKeyArn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeoutSeconds
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      EphemeralStorage:
        Size: 2048
      TracingConfig:
        Mode: Active
      LoggingConfig:
        # INFO: under Lambda Web Adapter the Nitro process writes plain-text
        # console.error lines, which JSON logging classifies as INFO; at WARN
        # every application error was dropped and only adapter warnings reached
        # CloudWatch.
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref LambdaLogGroup
        SystemLogLevel: WARN
      Environment:
        Variables:
          NODE_ENV: production
          APP_ENVIRONMENT: !Ref Environment
          HOST: 0.0.0.0
          PORT: "8080"
          NITRO_PORT: "8080"
          AWS_LWA_PORT: "8080"
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_READINESS_CHECK_PATH: /
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          SW_DDB_TABLE: !Ref DynamoTableName
          SW_S3_BUCKET: !Ref AppDataBucketName
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_DOMAIN: !Ref CognitoDomain
          COGNITO_REDIRECT_URI: !Ref CognitoRedirectUri
          COGNITO_LOGOUT_URI: !Ref CognitoLogoutUri
          KB_CLUSTER_ARN: !Ref KbClusterArn
          KB_SECRET_ARN: !Ref KbSecretArn
          KB_DATABASE: !Ref KbDatabase
          KB_INGEST_JOBS_TABLE: !If
            - HasKbIngest
            - !Ref KbIngestJobsTableName
            - !Ref AWS::NoValue
          KB_INGEST_QUEUE_URL: !If
            - HasKbIngest
            - !Ref KbIngestQueueUrl
            - !Ref AWS::NoValue
          MATTERS_CORPUS_BUCKET: !If
            - HasMattersCorpus
            - !Ref MattersCorpusBucketName
            - !Ref AWS::NoValue
          # Shared secret for the scheduled matters sync (and the other
          # /api/public ingest routes). Only exported when the sync is enabled.
          INGEST_API_KEY: !If
            - HasIngestConsumer
            - !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:INGEST_API_KEY}}"
            - !Ref AWS::NoValue
          # Bump RuntimeSecretRevision after rotating any key in the runtime
          # secret; the changed Environment forces the resolves above to re-read.
          RUNTIME_SECRET_REVISION: !Ref RuntimeSecretRevision
          BEDROCK_REGION: !Ref BedrockRegion
          # Research landing "Since you were here" headlines are OFF by default:
          # the brief derived topics from raw conversation titles and egressed
          # matter/party terms to Tavily/Firecrawl on page load (confidentiality).
          # Re-enable only after the brief is redesigned to use non-matter topics.
          RESEARCH_BRIEF: "on"
          # Office assistant model tiers (src/lib/writer/inference.server.ts).
          OFFICE_MODEL: !Ref OfficeModel
          OFFICE_FAST_MODEL: !Ref OfficeFastModel
          OFFICE_INSPECT_MODEL: !If [HasOfficeInspectModel, !Ref OfficeInspectModel, !Ref AWS::NoValue]
          OFFICE_THOROUGH_MODEL: !If [HasOfficeThoroughModel, !Ref OfficeThoroughModel, !Ref AWS::NoValue]
          OFFICE_TIERING: !Ref OfficeTiering
          # Workflows subsystem (src/lib/workflows). Dark unless SW_WORKFLOWS_ENABLED
          # is "true"; queued/scheduled runs need SW_WORKFLOWS_QUEUE_URL (the workflows
          # stack QueueUrl output); Python steps need an AgentCore interpreter id.
          SW_WORKFLOWS_ENABLED: !Ref WorkflowsEnabled
          SW_WORKFLOWS_QUEUE_URL: !Ref WorkflowsQueueUrl
          SW_WORKFLOWS_SCHEDULER_ENABLED: !Ref WorkflowsSchedulerEnabled
          SW_WORKFLOWS_PYTHON_INTERPRETER_ID: !Ref WorkflowsPythonInterpreterId
          SW_WORKFLOWS_DAILY_RUN_LIMIT: !Ref WorkflowsDailyRunLimit
          BEDROCK_RESEARCH_MODEL: !Ref BedrockResearchModel
          BDA_PROJECT_ARN: !Ref BdaProjectArn
          BDA_PROFILE_ARN: !Ref BdaProfileArn
          AGENTCORE_SEARCH_URL: !Ref AgentCoreGatewayUrl
          AGENTCORE_SEARCH_TOOL: !Ref AgentCoreSearchTool
          CODE_INTERPRETER_ID: !Ref AgentCoreCodeInterpreterId
          CORPUS_URL: !Ref CorpusUrl
          CORPUS_KEY: !Ref CorpusPublishableKey
          CORPUS_SERVICE_KEY: !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:CORPUS_SERVICE_KEY}}"
          # Research and Office assistant integrations. Brave + Tavily are the
          # primary web-search providers (the AgentCore gateway is the curated
          # anchor); CourtListener verifies citations; DocketBird reads dockets.
          # Absent keys disable their feature; they are never read from a
          # plaintext parameter. Tavily and Firecrawl also feed the research
          # landing's headlines. NCBI_API_KEY and OPENFDA_API_KEY are optional
          # rate-limit keys, unset until needed.
          BRAVE_API_KEY: !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:BRAVE_API_KEY}}"
          TAVILY_API_KEY: !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:TAVILY_API_KEY}}"
          FIRECRAWL_API_KEY: !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:FIRECRAWL_API_KEY}}"
          COURTLISTENER_API_TOKEN: !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:COURTLISTENER_API_TOKEN}}"
          DOCKETBIRD_API_KEY: !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:DOCKETBIRD_API_KEY}}"
          # Office engine (Sheets and Slides). Browsers and the Lambda both reach
          # it through this distribution's /engine/* behavior; the signing key is
          # read from Secrets Manager at runtime.
          OFFICE_ENGINE_URL: !If [HasOfficeEngine, !Ref OfficeEnginePublicUrl, !Ref AWS::NoValue]
          OFFICE_ENGINE_PUBLIC_URL: !If [HasOfficeEngine, !Ref OfficeEnginePublicUrl, !Ref AWS::NoValue]
          OFFICE_ENGINE_JWT_ISSUER: !If [HasOfficeEngine, !Ref OfficeEnginePublicUrl, !Ref AWS::NoValue]
          OFFICE_ENGINE_JWT_SECRET_ARN: !If [HasOfficeEngine, !Ref OfficeEngineJwtSecretArn, !Ref AWS::NoValue]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DeploymentIntent
          Value: !Ref DeploymentIntent
        - Key: ManagedBy
          Value: CloudFormation

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Metadata:
      com.aws.cloudformation.Context:
        why: Provide the only API Gateway response-streaming integration supported for this runtime.
        must:
          - Stay a Regional REST API with binary media passthrough and no endpoint caching.
        mutable: review-required
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-app"
      Description: !Sub >
        Streaming REST origin for ${Environment}; account logging is
        ${ApiGatewayAccountLoggingMode}.
      ApiKeySourceType: HEADER
      BinaryMediaTypes:
        - "*/*"
      DisableExecuteApiEndpoint: false
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DeploymentIntent
          Value: !Ref DeploymentIntent
        - Key: ManagedBy
          Value: CloudFormation

  ApiGatewayInvokeRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Let this exact REST API invoke only the environment Lambda function.
        must:
          - Scope both trust and permission to this account, API, and function.
        mutable: review-required
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ApiGatewayServiceTrust
            Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-streaming-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeFunction
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt AppFunction.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  RootMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      com.aws.cloudformation.Context:
        why: Stream the root route through Lambda InvokeWithResponseStream.
        must:
          - Keep AWS_PROXY, STREAM, and the response-streaming-invocations URI suffix together.
        mutable: change-with-constraints
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !GetAtt RestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials: !GetAtt ApiGatewayInvokeRole.Arn
        ResponseTransferMode: STREAM
        TimeoutInMillis: !Ref ApiIntegrationTimeoutMilliseconds
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${AppFunction.Arn}/response-streaming-invocations"

  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: "{proxy+}"

  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      com.aws.cloudformation.Context:
        why: Stream every application, auth, and API sub-route through the same Nitro server.
        must:
          - Keep AWS_PROXY, STREAM, and the response-streaming-invocations URI suffix together.
        mutable: change-with-constraints
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials: !GetAtt ApiGatewayInvokeRole.Arn
        ResponseTransferMode: STREAM
        TimeoutInMillis: !Ref ApiIntegrationTimeoutMilliseconds
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${AppFunction.Arn}/response-streaming-invocations"

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*"

  # --- Matters corpus sync (DocketBird -> Aurora + S3) -----------------------
  # EventBridge API destinations give an HTTP target 5 seconds, which is far too
  # short for a docket sync, so the schedule invokes this tiny Lambda instead and
  # it calls the app's sync route through CloudFront with a long timeout. The app
  # route itself does bounded work per call; the schedule catches the remainder.
  MattersSyncInvokerRole:
    Type: AWS::IAM::Role
    Condition: HasMattersSync
    Metadata:
      com.aws.cloudformation.Context:
        why: Least-privilege execution role for the scheduled sync invoker (logs only).
        must:
          - Grant nothing beyond CloudWatch Logs; the invoker holds no AWS data access.
        mutable: change-with-constraints
    Properties:
      RoleName: !Sub "${NamePrefix}-${Environment}-matters-sync-invoker"
      Path: !Sub "/lit-ai/${Environment}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  MattersSyncInvoker:
    Type: AWS::Lambda::Function
    Condition: HasMattersSync
    Metadata:
      com.aws.cloudformation.Context:
        why: Call POST /api/public/matters/sync on a schedule with a long HTTP timeout.
        must:
          - Go through the public origin (API Gateway requires the CloudFront-injected API key).
          - Never log the shared secret; log only the HTTP status and a bounded response excerpt.
        mutable: change-with-constraints
    Properties:
      FunctionName: !Sub "${NamePrefix}-${Environment}-matters-sync-invoker"
      Description: Scheduled trigger for the matters corpus DocketBird sync.
      Role: !GetAtt MattersSyncInvokerRole.Arn
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      Timeout: 290
      MemorySize: 256
      Environment:
        Variables:
          SYNC_URL: !If
            - HasCustomDomain
            - !Sub "https://${AppAliasDomain}/api/public/matters/sync"
            - !Sub "https://${Distribution.DomainName}/api/public/matters/sync"
          INGEST_API_KEY: !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:INGEST_API_KEY}}"
          RUNTIME_SECRET_REVISION: !Ref RuntimeSecretRevision
          MAX_DOCKETS: "3"
          MAX_DOWNLOADS: "40"
      Code:
        ZipFile: |
          "use strict";
          exports.handler = async () => {
            const url = process.env.SYNC_URL;
            const key = process.env.INGEST_API_KEY;
            if (!url || !key) throw new Error("SYNC_URL and INGEST_API_KEY are required");
            const body = JSON.stringify({
              maxDockets: Number(process.env.MAX_DOCKETS || 3),
              maxDownloads: Number(process.env.MAX_DOWNLOADS || 40),
              deadlineMs: 240000,
            });
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 280000);
            try {
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-ingest-key": key,
                  "user-agent": "litai-matters-sync-invoker/1.0",
                },
                body,
                signal: controller.signal,
              });
              const text = await res.text();
              console.log(JSON.stringify({ status: res.status, body: text.slice(0, 4000) }));
              if (!res.ok) throw new Error("matters sync returned HTTP " + res.status);
              return { status: res.status };
            } finally {
              clearTimeout(timer);
            }
          };
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  MattersSyncRule:
    Type: AWS::Events::Rule
    Condition: HasMattersSync
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-matters-sync"
      Description: Pull new docket entries and PDFs for followed hub dockets into the matters corpus.
      ScheduleExpression: !Ref MattersSyncSchedule
      State: ENABLED
      Targets:
        - Id: invoker
          Arn: !GetAtt MattersSyncInvoker.Arn

  MattersSyncInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasMattersSync
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MattersSyncInvoker
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MattersSyncRule.Arn

  IntelRefreshInvokerRole:
    Type: AWS::IAM::Role
    Condition: HasIntelRefresh
    Metadata:
      com.aws.cloudformation.Context:
        why: Execution role for the scheduled intel-refresh invoker (logs + invoke the app function).
        must:
          - Grant only CloudWatch Logs and lambda:InvokeFunction on the app function.
        mutable: change-with-constraints
    Properties:
      RoleName: !Sub "${NamePrefix}-${Environment}-intel-refresh-invoker"
      Path: !Sub "/lit-ai/${Environment}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: invoke-app-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${NamePrefix}-${Environment}-app"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  IntelRefreshInvoker:
    Type: AWS::Lambda::Function
    Condition: HasIntelRefresh
    Metadata:
      com.aws.cloudformation.Context:
        why: Fire the intel-refresh run off the HTTP path via a direct async invoke of the app function.
        must:
          - Invoke the app function asynchronously (Event) so the run is not bound by any HTTP/CloudFront timeout (the app Lambda has a 900s timeout).
          - Route the synthetic API Gateway v1 event to POST /api/public/intel/run; authenticate with the shared ingest key.
          - Never log the shared secret; log only that the async invoke was accepted.
        mutable: change-with-constraints
    Properties:
      FunctionName: !Sub "${NamePrefix}-${Environment}-intel-refresh-invoker"
      Description: Scheduled trigger for the litigation-intelligence feed refresh (async direct invoke).
      Role: !GetAtt IntelRefreshInvokerRole.Arn
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          APP_FUNCTION_NAME: !Sub "${NamePrefix}-${Environment}-app"
          INGEST_API_KEY: !Sub "{{resolve:secretsmanager:${CorpusServiceSecretArn}:SecretString:INGEST_API_KEY}}"
          RUNTIME_SECRET_REVISION: !Ref RuntimeSecretRevision
          DEADLINE_MS: "700000"
      Code:
        ZipFile: |
          "use strict";
          const { LambdaClient, InvokeCommand } = require("@aws-sdk/client-lambda");
          const lambda = new LambdaClient({});
          exports.handler = async () => {
            const fn = process.env.APP_FUNCTION_NAME;
            const key = process.env.INGEST_API_KEY;
            if (!fn || !key) throw new Error("APP_FUNCTION_NAME and INGEST_API_KEY are required");
            const body = JSON.stringify({ deadlineMs: Number(process.env.DEADLINE_MS || 700000) });
            // Minimal API Gateway REST (v1) proxy event so the Lambda Web Adapter
            // routes it to POST /api/public/intel/run in-process (no CloudFront cap).
            const event = {
              resource: "/{proxy+}",
              path: "/api/public/intel/run",
              httpMethod: "POST",
              headers: {
                "content-type": "application/json",
                "x-ingest-key": key,
                "user-agent": "litai-intel-refresh-invoker/2.0",
              },
              multiValueHeaders: {},
              queryStringParameters: null,
              multiValueQueryStringParameters: null,
              pathParameters: { proxy: "api/public/intel/run" },
              stageVariables: null,
              requestContext: {
                resourcePath: "/{proxy+}",
                httpMethod: "POST",
                path: "/api/public/intel/run",
                stage: "invoke",
              },
              body,
              isBase64Encoded: false,
            };
            const res = await lambda.send(new InvokeCommand({
              FunctionName: fn,
              InvocationType: "Event",
              Payload: Buffer.from(JSON.stringify(event)),
            }));
            console.log(JSON.stringify({ invoked: fn, statusCode: res.StatusCode }));
            return { statusCode: res.StatusCode };
          };
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  IntelRefreshRule:
    Type: AWS::Events::Rule
    Condition: HasIntelRefresh
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-intel-refresh"
      Description: Refresh the litigation-intelligence feed (Tavily + Firecrawl + Bedrock briefings + QA gate).
      ScheduleExpression: !Ref IntelRefreshSchedule
      State: ENABLED
      Targets:
        - Id: invoker
          Arn: !GetAtt IntelRefreshInvoker.Arn

  IntelRefreshInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasIntelRefresh
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IntelRefreshInvoker
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IntelRefreshRule.Arn

  ApiDeploymentBlue:
    Type: AWS::ApiGateway::Deployment
    Condition: UseBlueDeployment
    DependsOn:
      - RootMethod
      - ProxyMethod
    Metadata:
      com.aws.cloudformation.Context:
        why: Snapshot both streaming methods for the explicit environment stage.
        must:
          - Toggle ApiDeploymentSlot when method or integration semantics change.
        mutable: review-required
    Properties:
      RestApiId: !Ref RestApi
      Description: Blue REST response-streaming deployment.

  ApiDeploymentGreen:
    Type: AWS::ApiGateway::Deployment
    Condition: UseGreenDeployment
    DependsOn:
      - RootMethod
      - ProxyMethod
    Metadata:
      com.aws.cloudformation.Context:
        why: Alternate deployment snapshot so API-model changes always create a fresh deployment.
        must:
          - Toggle ApiDeploymentSlot when method or integration semantics change.
        mutable: review-required
    Properties:
      RestApiId: !Ref RestApi
      Description: Green REST response-streaming deployment.

  ApiStage:
    Type: AWS::ApiGateway::Stage
    DependsOn:
      - ApiInvokePermission
    Metadata:
      com.aws.cloudformation.Context:
        why: Apply access logging, metrics, X-Ray, and bounded throttling to every route.
        must:
          - Keep data tracing off and exclude request content from the access-log format.
        mutable: change-with-constraints
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !If
        - UseBlueDeployment
        - !Ref ApiDeploymentBlue
        - !Ref ApiDeploymentGreen
      StageName: !Ref ApiStageName
      Description: !Sub "${Environment} response-streaming application stage"
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","requestTimeEpoch":"$context.requestTimeEpoch","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationLatency":"$context.integration.latency"}
      CacheClusterEnabled: false
      MethodSettings:
        - DataTraceEnabled: false
          HttpMethod: "*"
          LoggingLevel: "OFF"
          MetricsEnabled: true
          ResourcePath: "/*"
          ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
          ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      TracingEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DeploymentIntent
          Value: !Ref DeploymentIntent
        - Key: ManagedBy
          Value: CloudFormation

  CloudFrontOriginApiKey:
    Type: AWS::ApiGateway::ApiKey
    Metadata:
      com.aws.cloudformation.Context:
        why: Verify that API origin traffic came through this CloudFront distribution.
        must:
          - Resolve the generated originKey from Secrets Manager and never accept a plaintext parameter.
        mutable: review-required
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-cloudfront-origin"
      Description: CloudFront origin verification key; not an end-user authentication control.
      Enabled: true
      Value: !Sub "{{resolve:secretsmanager:${OriginAccessSecretArn}:SecretString:originKey}}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  CloudFrontOriginUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ApiStage
    Properties:
      UsagePlanName: !Sub "${NamePrefix}-${Environment}-cloudfront-origin"
      Description: CloudFront-only origin throttle in addition to stage and WAF controls.
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: !Ref ApiStageName
      Throttle:
        BurstLimit: !Ref ApiThrottleBurstLimit
        RateLimit: !Ref ApiThrottleRateLimit
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  CloudFrontOriginUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref CloudFrontOriginApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref CloudFrontOriginUsagePlan

  SecurityResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Apply browser security headers consistently without transforming streamed bodies.
        must:
          - Never add a cache directive to authenticated dynamic responses.
        mutable: review-required
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${NamePrefix}-${Environment}-security"
        Comment: Browser security headers for dynamic and immutable application responses.
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
        CustomHeadersConfig:
          Items:
            # microphone=(self): the assistant composers dictate through the
            # browser microphone (audio goes to Bedrock Voxtral in-account via
            # /api/transcribe); an empty allowlist made getUserMedia fail on
            # every deployed page. Camera and geolocation stay denied.
            - Header: Permissions-Policy
              Value: "camera=(), geolocation=(), microphone=(self)"
              Override: true

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Metadata:
      com.aws.cloudformation.Context:
        why: Protect the only viewer entry point before requests reach API Gateway and Lambda.
        must:
          - Stay CloudFront-scoped with common, known-bad-input, and rate-based protections.
        mutable: review-required
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-edge"
      Description: !Sub "Managed edge protection for ${NamePrefix} ${Environment}"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref WafRateLimit
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${NamePrefix}-${Environment}-rate-limit"
            SampledRequestsEnabled: false
        # Both managed groups skip authenticated Office/Writer binary uploads
        # (DOCX/XLSX/PPTX/PDF bodies PUT or POSTed under /api/). Those bodies
        # are DEFLATE-compressed archives whose bytes trip the body-inspecting
        # rules at random (CrossSiteScripting_BODY blocked the Writer's
        # 30-second recovery snapshot on every tick, and saves intermittently,
        # while GenericLFI_BODY / ReactJSRCE_BODY hit other saves). The app
        # layer already gates these routes: a Cognito session is required for
        # every non-public /api/ route, bodies are size-capped and validated as
        # archives before anything is stored. Every other request, including
        # all JSON APIs and every unauthenticated path, is still inspected.
        - Name: AwsManagedCommon
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse:
                    Count: {}
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    AndStatement:
                      Statements:
                        - ByteMatchStatement:
                            FieldToMatch:
                              UriPath: {}
                            PositionalConstraint: STARTS_WITH
                            SearchString: /api/
                            TextTransformations:
                              - Priority: 0
                                Type: LOWERCASE
                        - OrStatement:
                            Statements:
                              - ByteMatchStatement:
                                  FieldToMatch:
                                    SingleHeader:
                                      Name: content-type
                                  PositionalConstraint: STARTS_WITH
                                  SearchString: application/vnd.openxmlformats-officedocument
                                  TextTransformations:
                                    - Priority: 0
                                      Type: LOWERCASE
                              - ByteMatchStatement:
                                  FieldToMatch:
                                    SingleHeader:
                                      Name: content-type
                                  PositionalConstraint: STARTS_WITH
                                  SearchString: application/pdf
                                  TextTransformations:
                                    - Priority: 0
                                      Type: LOWERCASE
                              - ByteMatchStatement:
                                  FieldToMatch:
                                    SingleHeader:
                                      Name: content-type
                                  PositionalConstraint: STARTS_WITH
                                  SearchString: application/octet-stream
                                  TextTransformations:
                                    - Priority: 0
                                      Type: LOWERCASE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${NamePrefix}-${Environment}-common"
            SampledRequestsEnabled: false
        - Name: AwsManagedKnownBadInputs
          Priority: 20
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    AndStatement:
                      Statements:
                        - ByteMatchStatement:
                            FieldToMatch:
                              UriPath: {}
                            PositionalConstraint: STARTS_WITH
                            SearchString: /api/
                            TextTransformations:
                              - Priority: 0
                                Type: LOWERCASE
                        - OrStatement:
                            Statements:
                              - ByteMatchStatement:
                                  FieldToMatch:
                                    SingleHeader:
                                      Name: content-type
                                  PositionalConstraint: STARTS_WITH
                                  SearchString: application/vnd.openxmlformats-officedocument
                                  TextTransformations:
                                    - Priority: 0
                                      Type: LOWERCASE
                              - ByteMatchStatement:
                                  FieldToMatch:
                                    SingleHeader:
                                      Name: content-type
                                  PositionalConstraint: STARTS_WITH
                                  SearchString: application/pdf
                                  TextTransformations:
                                    - Priority: 0
                                      Type: LOWERCASE
                              - ByteMatchStatement:
                                  FieldToMatch:
                                    SingleHeader:
                                      Name: content-type
                                  PositionalConstraint: STARTS_WITH
                                  SearchString: application/octet-stream
                                  TextTransformations:
                                    - Priority: 0
                                      Type: LOWERCASE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${NamePrefix}-${Environment}-known-bad"
            SampledRequestsEnabled: false
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${NamePrefix}-${Environment}-edge"
        SampledRequestsEnabled: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DeploymentIntent
          Value: !Ref DeploymentIntent
        - Key: ManagedBy
          Value: CloudFormation

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - CloudFrontOriginUsagePlanKey
    Metadata:
      com.aws.cloudformation.Context:
        why: Preserve browser cookies and SSE while caching only immutable Vite assets.
        must:
          - Default to no cache, forward all viewer state except Host, require HTTPS, and attach WAF.
        mutable: review-required
    Properties:
      DistributionConfig:
        Comment: !Sub "Lit AI ${Environment} streaming application"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref CloudFrontPriceClass
        Aliases: !If
          - HasCustomDomain
          - - !Ref AppAliasDomain
          - !Ref AWS::NoValue
        WebACLId: !GetAtt WebAcl.Arn
        Origins:
          - Id: RegionalRestApi
            DomainName: !Sub "${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
            OriginPath: !Sub "/${ApiStageName}"
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginKeepaliveTimeout: 5
              OriginProtocolPolicy: https-only
              OriginReadTimeout: !Ref CloudFrontOriginReadTimeout
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: x-api-key
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginAccessSecretArn}:SecretString:originKey}}"
          - !If
            - HasOfficeEngine
            - Id: OfficeEngineAlb
              DomainName: !Ref OfficeEngineOriginDomain
              ConnectionAttempts: 3
              ConnectionTimeout: 10
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginKeepaliveTimeout: 60
                OriginProtocolPolicy: !Ref OfficeEngineOriginProtocol
                OriginReadTimeout: 60
                OriginSSLProtocols:
                  - TLSv1.2
              OriginCustomHeaders:
                - HeaderName: X-Office-Origin-Key
                  HeaderValue: !Sub "{{resolve:secretsmanager:${OriginAccessSecretArn}:SecretString:officeEngineOriginKey}}"
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: RegionalRestApi
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: false
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: !Ref SecurityResponseHeadersPolicy
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: RegionalRestApi
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityResponseHeadersPolicy
          - !If
            - HasOfficeEngine
            # Office engine RPC: authenticated with platform-minted tokens
            # (Authorization header forwarded by AllViewerExceptHostHeader),
            # never cached, stickiness cookie forwarded so a session stays on
            # the task that owns it.
            - PathPattern: /engine/*
              TargetOriginId: OfficeEngineAlb
              ViewerProtocolPolicy: https-only
              AllowedMethods:
                - DELETE
                - GET
                - HEAD
                - OPTIONS
                - PATCH
                - POST
                - PUT
              CachedMethods:
                - GET
                - HEAD
              Compress: false
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              ResponseHeadersPolicyId: !Ref SecurityResponseHeadersPolicy
            - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DeploymentIntent
          Value: !Ref DeploymentIntent
        - Key: ManagedBy
          Value: CloudFormation

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-lambda-errors"
      AlarmDescription: Lambda returned one or more invocation errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-lambda-throttles"
      AlarmDescription: Lambda invocation was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-lambda-duration"
      AlarmDescription: Lambda p95 duration is sustained above the configured threshold.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref LambdaDurationAlarmMilliseconds
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-api-5xx"
      AlarmDescription: API Gateway returned one or more server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${NamePrefix}-${Environment}-app"
        - Name: Stage
          Value: !Ref ApiStageName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-api-latency"
      AlarmDescription: API Gateway p95 latency is sustained above the configured threshold.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub "${NamePrefix}-${Environment}-app"
        - Name: Stage
          Value: !Ref ApiStageName
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref ApiLatencyAlarmMilliseconds
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  LambdaFunctionName:
    Description: Name of the Nitro Lambda function.
    Value: !Ref AppFunction

  LambdaFunctionArn:
    Description: ARN of the Nitro Lambda function.
    Value: !GetAtt AppFunction.Arn

  RuntimeRoleArn:
    Description: Runtime role combining app-foundation and KB producer policies.
    Value: !GetAtt RuntimeRole.Arn

  RestApiId:
    Description: Regional response-streaming REST API identifier.
    Value: !Ref RestApi

  RestApiOriginUrl:
    Description: >
      Direct origin URL. Calls require the generated origin API key and should
      not be distributed to viewers.
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}"

  CloudFrontDistributionId:
    Description: CloudFront distribution identifier.
    Value: !Ref Distribution

  CloudFrontDomainName:
    Description: CloudFront hostname used for the staging baseline.
    Value: !GetAtt Distribution.DomainName

  CloudFrontUrl:
    Description: HTTPS application origin for Cognito callback and logout settings.
    Value: !Sub "https://${Distribution.DomainName}"

  WebAclArn:
    Description: CloudFront-scoped WAF web ACL ARN.
    Value: !GetAtt WebAcl.Arn

  LambdaLogGroupName:
    Description: KMS-encrypted retained Lambda log group.
    Value: !Ref LambdaLogGroup

  ApiAccessLogGroupName:
    Description: KMS-encrypted retained REST API access log group.
    Value: !Ref ApiAccessLogGroup

  ArtifactCoordinates:
    Description: Immutable S3 artifact coordinate used by this Lambda version.
    Value: !Sub "s3://${ArtifactBucketName}/${ArtifactObjectKey}?versionId=${ArtifactObjectVersion}"
